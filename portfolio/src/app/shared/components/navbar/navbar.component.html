<nav class="fixed top-0 w-full bg-black/80 backdrop-blur-md z-50 border-b border-line">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="flex justify-end items-center h-16">
            <!-- Desktop Menu -->
            <div class="hidden md:flex gap-8 text-xs uppercase tracking-widest">
                @for (item of navItems; track item.id) {
                <button (click)="scrollTo(item.id)" class="text-ink-500 hover:text-white transition-colors">
                    {{ item.label }}
                </button>
                }
            </div>

            <!-- Mobile Menu Button -->
            <button (click)="toggleMobileMenu()" class="md:hidden text-ink-500 hover:text-white">
                @if (!isMobileMenuOpen()) {
                <app-icon name="menu" className="w-6 h-6" />
                } @else {
                <app-icon name="close" className="w-6 h-6" />
                }
            </button>
        </div>

        <!-- Mobile Menu -->
        @if (isMobileMenuOpen()) {
        <div class="md:hidden pb-4 space-y-1">
            @for (item of navItems; track item.id) {
            <button (click)="scrollToAndClose(item.id)"
                class="block w-full text-left px-4 py-2 text-ink-500 hover:text-white hover:bg-surface rounded-lg transition-colors uppercase text-xs tracking-widest">
                {{ item.label }}
            </button>
            }
        </div>
        }
    </div>
</nav>
