<section id="contact" class="relative py-20 px-6 overflow-hidden">

    <!-- Corner accent: top-left (broadcast signal) -->
    <svg class="hidden md:block absolute top-6 left-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
        <circle cx="30" cy="90" r="3" fill="#f472b6" />
        <path d="M40 80 A25 25 0 0 1 40 40" stroke="#f472b6" stroke-width="1.5" />
        <path d="M52 68 A45 45 0 0 1 52 20" stroke="#f472b6" stroke-width="1.5" opacity="0.6" />
    </svg>

    <!-- Corner accent: bottom-right (send arrow) -->
    <svg class="hidden md:block absolute bottom-6 right-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
        <path d="M20 100 L100 20" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 5" />
        <path d="M85 20 L100 20 L100 35" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="20" cy="100" r="3" fill="#34d399" />
    </svg>

    <div class="max-w-7xl mx-auto text-center">
        <app-section-header index="06" title="Get in Touch" />

        <p class="text-ink-500 mb-12 max-w-2xl mx-auto text-sm">
            Want to collaborate or just say hi? I'm always open to discussing new projects, creative ideas, or
            opportunities to be part of your vision.
        </p>

        <div class="flex flex-wrap justify-center gap-4 mb-8">
            <a [href]="'mailto:' + personalInfo().email"
                class="px-8 py-3 bg-white hover:bg-white/85 rounded-full transition-colors flex items-center gap-2 text-black font-bold uppercase text-sm tracking-wide">
                <app-icon name="mail" className="w-4 h-4" />
                Send Email
            </a>
            <a [href]="socialLinks().linkedin" target="_blank"
                class="px-8 py-3 border border-line hover:border-white/40 rounded-full transition-colors flex items-center gap-2 text-ink-700 uppercase text-sm tracking-wide">
                <app-icon name="linkedin" className="w-4 h-4" />
                Connect on LinkedIn
            </a>
        </div>

        <!-- Social Icons -->
        <div class="flex justify-center gap-4">
            <a [href]="socialLinks().linkedin" target="_blank"
                class="w-12 h-12 bg-surface border border-line rounded-lg flex items-center justify-center text-ink-500 hover:border-white/40 hover:text-white transition-colors">
                <app-icon name="linkedin" className="w-5 h-5" />
            </a>
            <a [href]="socialLinks().github" target="_blank"
                class="w-12 h-12 bg-surface border border-line rounded-lg flex items-center justify-center text-ink-500 hover:border-white/40 hover:text-white transition-colors">
                <app-icon name="github" className="w-5 h-5" />
            </a>
            <a [href]="socialLinks().leetcode" target="_blank"
                class="w-12 h-12 bg-surface border border-line rounded-lg flex items-center justify-center text-ink-500 hover:border-white/40 hover:text-white transition-colors">
                <app-icon name="leetcode" className="w-5 h-5" />
            </a>
        </div>
    </div>
</section>
