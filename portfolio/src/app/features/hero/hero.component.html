<section class="relative pt-32 pb-20 px-6 overflow-hidden">

  <!-- Corner accent: top-left (bracket + node) -->
  <svg class="hidden md:block absolute top-6 left-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
    <defs>
      <linearGradient id="heroCornerTL" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#ff3b30" />
      </linearGradient>
    </defs>
    <path d="M2 110 V14 Q2 2 14 2 H110" stroke="url(#heroCornerTL)" stroke-width="2" stroke-linecap="round" />
    <circle cx="34" cy="34" r="3.5" fill="#ff3b30" />
    <path d="M34 44 V60 M24 34 H8" stroke="#3b82f6" stroke-width="1.25" stroke-dasharray="3 4" />
  </svg>

  <!-- Corner accent: top-right (mirrored bracket + diamond) -->
  <svg class="hidden md:block absolute top-6 right-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
    <defs>
      <linearGradient id="heroCornerTR" x1="120" y1="120" x2="0" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#34d399" />
        <stop offset="100%" stop-color="#ff6b8a" />
      </linearGradient>
    </defs>
    <path d="M118 110 V14 Q118 2 106 2 H10" stroke="url(#heroCornerTR)" stroke-width="2" stroke-linecap="round" />
    <rect x="79" y="29" width="11" height="11" stroke="#ff6b8a" stroke-width="1.5" transform="rotate(45 84.5 34.5)" />
  </svg>

  <!-- Corner accent: bottom-left (orbit + reticle) -->
  <svg class="hidden md:block absolute bottom-6 left-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
    <circle cx="55" cy="65" r="36" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 6" />
    <path d="M55 15 V33 M55 97 V115 M5 65 H23 M87 65 H105" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  </svg>

  <!-- Corner accent: bottom-right (triangle in orbit) -->
  <svg class="hidden md:block absolute bottom-6 right-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
    <circle cx="65" cy="45" r="40" stroke="#ff6b8a" stroke-width="1.5" />
    <path d="M25 105 L90 105 L90 20 Z" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round" />
  </svg>

  <div class="max-w-7xl mx-auto text-center">

    <p class="font-dot text-accent-500 text-sm tracking-widest mb-4 uppercase">// Hello, I'm</p>
    <h1 class="text-5xl md:text-7xl font-bold mb-6 text-ink-900 uppercase tracking-tight">
      {{ personalInfo().name }}
    </h1>
    <p class="text-xl md:text-2xl text-ink-700 font-bold mb-4 uppercase tracking-[0.2em]">{{ personalInfo().title }}</p>
    <p class="text-ink-500 text-sm mb-6">
      Builds Scalable Web Apps • Obsessed with Clean Code &amp; Seamless UX
    </p>
    <p class="inline-block font-dot text-xs text-ink-900 mb-8 px-3 py-1 border border-line rounded-full bg-surface">
      #1PercentBetterEveryday
    </p>

    <!-- Contact Info -->
    <div class="flex flex-wrap justify-center gap-x-6 gap-y-3 text-xs uppercase tracking-wide text-ink-500 mb-10">
      <a [href]="'mailto:' + personalInfo().email"
        class="flex items-center gap-2 hover:text-white transition-colors">
        <app-icon name="mail" className="w-4 h-4" />
        {{ personalInfo().email }}
      </a>

      <a [href]="'tel:' + personalInfo().phone" class="flex items-center gap-2 hover:text-white transition-colors">
        <app-icon name="phone" className="w-4 h-4" />
        {{ personalInfo().phone }}
      </a>

      <a [href]="socialLinks().whatsapp" target="_blank"
        class="flex items-center gap-2 hover:text-white transition-colors">
        <app-icon name="whatsapp" className="w-4 h-4" />
        WhatsApp
      </a>

      <a [href]="socialLinks().instagram" target="_blank"
        class="flex items-center gap-2 hover:text-white transition-colors">
        <app-icon name="instagram" className="w-4 h-4" />
        Instagram
      </a>

      <a [href]="socialLinks().linkedin" target="_blank"
        class="flex items-center gap-2 hover:text-white transition-colors">
        <app-icon name="linkedin" className="w-4 h-4" />
        LinkedIn
      </a>

      <a [href]="socialLinks().github" target="_blank"
        class="flex items-center gap-2 hover:text-white transition-colors">
        <app-icon name="github" className="w-4 h-4" />
        GitHub
      </a>

      <a [href]="socialLinks().leetcode" target="_blank"
        class="flex items-center gap-2 hover:text-white transition-colors">
        <app-icon name="leetcode" className="w-4 h-4" />
        LeetCode
      </a>
    </div>

    <!-- CTA Buttons -->
    <div class="flex flex-wrap justify-center gap-4">
      <a [href]="'mailto:' + personalInfo().email"
        class="px-8 py-3 bg-white hover:bg-white/85 rounded-full transition-colors flex items-center gap-2 text-black font-bold uppercase text-sm tracking-wide">
        <app-icon name="mail" className="w-4 h-4" />
        Get in Touch
      </a>
      <button (click)="downloadResume()"
        class="px-8 py-3 border border-line hover:border-white/40 rounded-full transition-colors flex items-center gap-2 text-ink-700 uppercase text-sm tracking-wide">
        <app-icon name="download" className="w-4 h-4" />
        Download Resume
      </button>
    </div>
  </div>
</section>
