<div class="relative bg-surface backdrop-blur-sm border border-line rounded-2xl p-6 hover:border-white/30 transition-colors">
    <app-corner-frame />
    <div class="flex items-start gap-4">
        <div
            class="flex-shrink-0 w-12 h-12 border border-dashed border-line rounded-lg flex items-center justify-center">
            <app-icon name="graduation-cap" className="w-6 h-6 text-white" />
        </div>

        <div class="flex-grow">
            <h3 class="text-base font-bold text-ink-900 uppercase tracking-wide mb-1">{{ education().institution }}</h3>
            <p class="text-ink-700 text-sm mb-2">{{ education().degree }}</p>
            <p class="text-xs uppercase tracking-wide text-ink-400 flex items-center gap-2">
                <app-icon name="calendar" className="w-4 h-4" />
                {{ education().period }}
            </p>
        </div>
    </div>
</div>
