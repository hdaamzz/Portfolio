<section id="education" class="relative py-20 px-6 overflow-hidden">

  <!-- Corner accent: top-left (hexagon seal) -->
  <svg class="hidden md:block absolute top-6 left-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
    <path d="M60 15 L100 37.5 V82.5 L60 105 L20 82.5 V37.5 Z" stroke="#facc15" stroke-width="1.5" class="accent-spin" />
    <path d="M60 40 L78 51 V73 L60 84 L42 73 V51 Z" stroke="#facc15" stroke-width="1.25" opacity="0.6" class="accent-spin-reverse" />
  </svg>

  <!-- Corner accent: bottom-right (graduation cap) -->
  <svg class="hidden md:block absolute bottom-6 right-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
    <path d="M20 55 L60 35 L100 55 L60 75 Z" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M60 75 V95" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="60" cy="95" r="3" fill="#a78bfa" class="accent-pulse" />
  </svg>

  <div class="max-w-7xl mx-auto">

    <app-section-header index="05" title="Education" />

    <div class="space-y-6 max-w-4xl mx-auto">
      @for (edu of education(); track edu.institution) {
      <app-education-card [education]="edu" />
      }
    </div>
  </div>
</section>
