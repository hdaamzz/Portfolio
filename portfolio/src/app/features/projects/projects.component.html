<section id="projects" class="relative py-20 px-6 overflow-hidden">

    <!-- Corner accent: top-left (layered cards) -->
    <svg class="hidden md:block absolute top-6 left-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
        <rect x="20" y="35" width="55" height="40" rx="4" stroke="#fb7185" stroke-width="1.5" />
        <rect x="35" y="20" width="55" height="40" rx="4" stroke="#fb7185" stroke-width="1.5" opacity="0.6" />
    </svg>

    <!-- Corner accent: bottom-right (blueprint grid) -->
    <svg class="hidden md:block absolute bottom-6 right-6 w-20 h-20 lg:w-28 lg:h-28 opacity-70 pointer-events-none" viewBox="0 0 120 120" fill="none">
        <rect x="20" y="20" width="80" height="80" stroke="#22d3ee" stroke-width="1" opacity="0.5" />
        <path d="M20 47 H100 M20 73 H100 M47 20 V100 M73 20 V100" stroke="#22d3ee" stroke-width="1" opacity="0.5" />
    </svg>

    <div class="max-w-7xl mx-auto">
        <app-section-header index="04" title="Projects" />

        <p class="text-ink-500 mb-12 max-w-3xl mx-auto text-center text-sm">
            I've worked on a variety of projects, from simple websites to complex web applications. Here are a few of my
            favorites.
        </p>

        <!-- Professional Projects Grid -->
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
            @for (project of professionalProjects(); track project.title) {
            <app-project-card [project]="project" [isProfessional]="true" />
            }
        </div>

        <!-- Other Projects -->
        <div class="flex items-center gap-4 mb-6 max-w-4xl mx-auto">
            <h3 class="text-sm font-bold px-0 text-ink-900 uppercase tracking-[0.2em]">
                Other Projects
            </h3>
            <div class="flex-1 border-t border-dashed border-line"></div>
        </div>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            @for (project of otherProjects(); track project.title) {
            <app-project-card [project]="project" [isProfessional]="false" />
            }
        </div>

        <!-- View All Projects Button -->
        <div class="text-center">
            <a [href]="socialLinks().github" target="_blank"
                class="inline-flex items-center gap-2 px-6 py-3 border border-line hover:border-white/40 rounded-full transition-colors text-ink-700 uppercase text-sm tracking-wide">
                <app-icon name="github" className="w-5 h-5" />
                View All Projects on GitHub
            </a>
        </div>
    </div>
</section>
